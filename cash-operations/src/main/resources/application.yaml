spring:
  application:
    name: cash-operations
  datasource:
    url: jdbc:sqlserver://;serverName=localhost;databaseName=BankingDB;encrypt=true;trustServerCertificate=true;integratedSecurity=true;
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect   